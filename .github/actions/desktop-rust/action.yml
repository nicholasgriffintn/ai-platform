name: Desktop Rust toolchain
description: Install the Rust toolchain pinned by the desktop core, with optional components and targets.

inputs:
  components:
    description: Space-separated toolchain components, such as "clippy rustfmt".
    required: false
    default: ""
  targets:
    description: Space-separated compilation targets.
    required: false
    default: ""
  cache-key:
    description: Suffix that keeps build caches for different bundle targets apart.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: apps/desktop/src-tauri
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail

        channel="$(sed -nE 's/^channel *= *"(.*)" *$/\1/p' rust-toolchain.toml)"

        if [ -z "$channel" ]; then
          echo "rust-toolchain.toml does not pin a channel." >&2
          exit 1
        fi

        install=(rustup toolchain install "$channel" --profile minimal --no-self-update)

        for component in $COMPONENTS; do
          install+=(--component "$component")
        done

        for target in $TARGETS; do
          install+=(--target "$target")
        done

        "${install[@]}"

    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: ${{ inputs.cache-key }}
