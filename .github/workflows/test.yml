name: Test

on:
  pull_request:
    branches:
      - canary
      - "*.x"
      - "main"
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        run: pnpm check
      - name: Run typechecks
        run: pnpm typecheck
      - name: Run tests
        run: pnpm ci:test
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
      - name: Coverage summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f "./coverage/coverage-summary.json" ]; then
            echo "### Overall Coverage" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat ./coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Workspace Coverage" >> $GITHUB_STEP_SUMMARY
          for app in apps/*/; do
            if [ -f "${app}coverage/coverage-summary.json" ]; then
              echo "#### $(basename $app)" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "${app}coverage/coverage-summary.json" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && format('{0}/2', matrix.shard) || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PVC_SERVER_URL: ${{ vars.PVC_SERVER_URL }}
      PVC_TOKEN: ${{ secrets.PVC_TOKEN }}
      PVC_FAIL_ON_DIFF: "0"
      PVC_ON_MISSING: pending
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build packages and app for end-to-end tests
        run: pnpm build:e2e
      # One day this might be needed but i think 100% smoke is fine for now.
      # - name: Run end-to-end release tests
      #   if: github.event_name == 'pull_request'
      #   run: pnpm test:e2e:release --shard=${{ matrix.shard }}/2
      - name: Run end-to-end smoke tests
        # if: github.event_name == 'push'
        run: pnpm test:e2e:smoke
      - name: Gate on visual review
        if: env.PVC_SERVER_URL != '' && env.PVC_TOKEN != ''
        run: pnpm exec pvc status
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-gate:
    name: E2E gate
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check end-to-end result
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = "success" || test "$E2E_RESULT" = "skipped"
