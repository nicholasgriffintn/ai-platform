name: Desktop build

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long to keep the packaged archives.
        type: number
        default: 7
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Update-signing key.
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Passphrase for the update-signing key.
        required: false
      APPLE_CERTIFICATE:
        description: Base64 Developer ID Application certificate.
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        description: Passphrase for the exported certificate.
        required: false
      APPLE_SIGNING_IDENTITY:
        description: Full identity name, beginning Developer ID Application.
        required: true
      APPLE_API_KEY:
        description: App Store Connect key identifier used for notarisation.
        required: true
      APPLE_API_ISSUER:
        description: App Store Connect issuer identifier.
        required: true
      APPLE_API_KEY_P8:
        description: Base64 contents of the App Store Connect .p8 private key.
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app
          - label: linux-x86_64
            runner: ubuntu-latest
            rust-targets: ""
            tauri-args: --bundles appimage,deb
          - label: windows-x86_64
            runner: windows-latest
            rust-targets: ""
            tauri-args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Prepare the Rust toolchain
        uses: ./.github/actions/desktop-rust
        with:
          targets: ${{ matrix.rust-targets }}
          cache-key: ${{ matrix.label }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore the Vite+ task cache
        uses: ./.github/actions/vite-task-cache

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Write the notarisation key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build the desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: >
          pnpm --filter @assistant/desktop tauri build
          ${{ matrix.tauri-args }}
          --config src-tauri/tauri.updater.conf.json

      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Polychat.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Package the bundle
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./apps/desktop/package.json').version")"
          target="apps/desktop/src-tauri/target"
          staging="build-staging"
          output="dist-release"
          name="polychat-desktop-${version}-${LABEL}"

          mkdir -p "$staging" "$output"

          case "$RUNNER_OS" in
            macOS)
              bundle="$target/universal-apple-darwin/release/bundle"
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/Polychat.app" "$output/$name.zip"
              cp "$bundle/macos/Polychat.app.tar.gz" "$output/$name.app.tar.gz"
              cp "$bundle/macos/Polychat.app.tar.gz.sig" "$output/$name.app.tar.gz.sig"
              ;;
            Linux)
              bundle="$target/release/bundle"
              cp "$bundle"/appimage/*.AppImage "$staging"/
              cp "$bundle"/deb/*.deb "$staging"/
              (cd "$staging" && zip -r -j "../$output/$name.zip" .)
              cp "$bundle"/appimage/*.AppImage "$output/$name.AppImage"
              cp "$bundle"/appimage/*.AppImage.sig "$output/$name.AppImage.sig"
              ;;
            Windows)
              bundle="$target/release/bundle"
              cp "$bundle"/nsis/*-setup.exe "$staging"/
              cp "$bundle"/msi/*.msi "$staging"/
              (cd "$staging" && 7z a "../$output/$name.zip" ./*)
              cp "$bundle"/nsis/*-setup.exe "$output/$name-setup.exe"
              cp "$bundle"/nsis/*-setup.exe.sig "$output/$name-setup.exe.sig"
              ;;
          esac

          ls -l "$output"

      - name: Test the packaged window
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          POLYCHAT_DESKTOP_BINARY: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/polychat-desktop
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail

          sudo apt-get install --no-install-recommends --yes webkit2gtk-driver xvfb
          cargo install tauri-driver --version "^2" --locked
          timeout 10m xvfb-run --auto-servernum pnpm --filter @assistant/desktop test:e2e

      - name: Upload the packaged bundle
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
