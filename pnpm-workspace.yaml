packages:
  - packages/*
  - apps/*

allowBuilds:
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: false
  protobufjs: false
  sharp: false
  workerd: false

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260523.1 || 4.20260530.1 || 5.20260808.1 || 5.20260809.1'
  - '@scalar/client-side-rendering@0.1.12'
  - '@scalar/hono-api-reference@0.10.19'
  - '@scalar/schemas@0.3.2'
  - '@scalar/types@0.12.2'
  - '@tanstack/query-core@5.100.13'
  - '@tanstack/query-devtools@5.100.13'
  - '@tanstack/react-query-devtools@5.100.13'
  - '@tanstack/react-query@5.100.13'
  - '@aws-sdk/client-bedrock@3.1057.0'
  - '@aws-sdk/client-s3@3.1057.0'
  - '@aws-sdk/credential-provider-ini@3.972.46'
  - '@aws-sdk/credential-provider-node@3.972.47'
  - '@aws-sdk/s3-request-presigner@3.1057.0'
  - '@aws-sdk/token-providers@3.1057.0'
  - miniflare@4.20260702.0
  - wrangler@4.107.1
  - '@ngriffin_uk/*'
  - partyserver@0.5.10

onlyBuiltDependencies:
  - better-sqlite3

overrides:
  "fast-uri@>=3.0.0 <3.1.5": "3.1.5"
  "ip-address@<=10.3.0": "10.3.1"
  "nanoid@<3.3.17": "3.3.17"
  partyserver: 0.5.10
  "postcss@>=8.0.0 <8.5.23": "8.5.25"
  "sharp@<0.35.0": "0.35.3"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
