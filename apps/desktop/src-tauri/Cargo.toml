[package]
name = "polychat-desktop"
version = "0.2.0"
description = "Polychat desktop shell"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opener = { version = "0.8", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.4"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["time", "macros", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
